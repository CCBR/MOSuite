url: https://ccbr.github.io/MOSuite/
template:
  bootstrap: 5
  bslib:
    bootswatch: yeti
    primary: "#2A7386"
    secondary: "#82C04D"
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto"}
    code_font: {google: "Roboto Mono"}
    border-radius: 0
    btn-border-radius: 3px
    grid-gutter-width: 3rem
    pkgdown-nav-height: 78px
footer:
  structure:
    left: [developed_by]

development:
  mode: auto
authors:
  Kelly Sovacool:
    href: "https://github.com/kelly-sovacool"
  Philip Homan:
    href: "https://github.com/phoman14"
  Vishal Koparde:
    href: "https://github.com/kopardev"
  CCR Collaborative Bioinformatics Resource:
    href: "https://github.com/CCBR"
  footer:
    roles: [cph, fnd]
    text: "Created by the"

articles:
- title: Articles
  navbar: ~
  contents:
  - intro
  - renee
  - visualization
  - memory

reference:
- title: Main analysis functions
  desc: See `vignette('intro')` for recommended usage
  contents:
    - has_concept("main analysis")
- title: multiOmicDataSet class
- subtitle: multiOmicDataSet constructors, readers, & writers
  contents:
    - has_concept("moo IO")
- subtitle: multiOmicDataSet methods
  desc: All other functions that accept a `multiOmicDataSet` as the first argument.
  contents:
    - has_concept("moo methods")
    - -has_concept("moo IO")
- title: Visualization
  contents:
    - has_keyword("plotters")
    - render_report
- subtitle: Color palette
  contents:
    - contains("color")
    - contains("palette")
- subtitle: Low-level plot helpers
  desc: |
    These functions are called by the main visualization functions.
  contents:
    - starts_with("plot_")
    - -has_keyword("plotters")
- title: Misc. helpers & utilities
  contents:
    - starts_with('calc_')
    - has_keyword('utilities')
- title: Datasets
  contents:
    - has_keyword('data')
- title: Options
  contents:
    - options
- title: Re-exports
  contents:
    - reexports
