name: docker

on:
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description:
          "Prerelease tag to apply to the built docker image (e.g. 'v0.3.0.9000' or
          'v0.3.0-my-feature'). Must be a valid docker tag and must not match an
          existing GitHub release tag. If not specified, it will be
          determined from the DESCRIPTION file."
        required: false
        default: ""
  release:
    types: [published, released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: "./"
  NAMESPACE: "nciccbr"

jobs:
  vars:
    # Stable publications also emit "released"; run only that event for stable releases.
    if: github.event_name != 'release' || github.event.action != 'published' || github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      r_version: ${{ steps.vars.outputs.r_version }}
      date: ${{ steps.vars.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: prepare variables
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.docker_image_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${EVENT_NAME}" = "release" ]; then
            version="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            version="${INPUT_TAG}"
          else
            version="$(grep '^Version:' ./DESCRIPTION | sed 's/Version: /v/')"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [[ ! "${version}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::'${version}' is not a valid docker tag"
              exit 1
            fi
            if [ "${version}" = "latest" ] || [[ "${version}" == buildcache-* ]]; then
              echo "::error::'${version}' is reserved for release and cache images"
              exit 1
            fi
            # don't let manual builds overwrite images published for a release
            if err="$(gh api "repos/${GH_REPO}/releases/tags/${version}" 2>&1 >/dev/null)"; then
              echo "::error::'${version}' is an existing release tag; choose a different tag for manual builds"
              exit 1
            elif [[ "${err}" != *"HTTP 404"* ]]; then
              echo "::error::Could not check whether '${version}' is a release tag: ${err}"
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # fetch R version: get the previous release version from r-hub API.
          # staying one version behind release helps wait for packages to catch
          # up so we're not on the bleeding edge.
          r_version="$(curl -fsSL https://api.r-hub.io/rversions/r-oldrel | jq -r '.version')"
          if [[ ! "${r_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine R version from r-hub (got '${r_version}')"
            exit 1
          fi
          echo "r_version=${r_version}" >> "$GITHUB_OUTPUT"

          echo "date=$(date +"%Y-%m-%d")" >> "$GITHUB_OUTPUT"

  build:
    needs: vars
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [mosuite, mosuite-minimal]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: mosuite
            dockerfile: docker/Dockerfile
          - image: mosuite-minimal
            dockerfile: docker/Dockerfile-minimal
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_DATE=${{ needs.vars.outputs.date }}
            BUILD_TAG=${{ needs.vars.outputs.version }}
            REPONAME=${{ matrix.image }}
            R_VERSION=${{ needs.vars.outputs.r_version }}
          # registry cache rather than type=gha: these layers are far larger
          # than the 10 GB GitHub Actions cache quota
          cache-from: type=registry,ref=${{ env.NAMESPACE }}/${{ matrix.image
            }}:buildcache-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=${{ env.NAMESPACE }}/${{ matrix.image
            }}:buildcache-${{ matrix.platform_pair
            }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.NAMESPACE }}/${{ matrix.image
            }},push-by-digest=true,name-canonical=true,push=true
      - name: Check image packages
        env:
          IMAGE: ${{ env.NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          docker run --rm \
            -e IMAGE_KIND="${IMAGE_KIND}" \
            -v "${GITHUB_WORKSPACE}/DESCRIPTION:/tmp/MOSuite-DESCRIPTION:ro" \
            -v "${GITHUB_WORKSPACE}/docker/check-image-packages.R:/tmp/check-image-packages.R:ro" \
            "${IMAGE}" Rscript /tmp/check-image-packages.R \
            "${IMAGE_KIND}" /tmp/MOSuite-DESCRIPTION
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          # '.' separator: 'digests-mosuite-*' would also match mosuite-minimal
          name: digests.${{ matrix.image }}.${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [mosuite, mosuite-minimal]
    steps:
      - uses: actions/checkout@v7
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests.${{ matrix.image }}.*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          IMAGE: ${{ env.NAMESPACE }}/${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image }}
          VERSION: ${{ needs.vars.outputs.version }}
        run: |
          # GITHUB_TOKEN can only push to the repo owner's ghcr namespace, which must be lowercase
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          tags=(-t "${IMAGE}:${VERSION}" -t "${GHCR_IMAGE}:${VERSION}")
          if [ "${EVENT_NAME}" = "release" ] && [ "${PRERELEASE}" != "true" ]; then
            tags+=(-t "${IMAGE}:latest" -t "${GHCR_IMAGE}:latest")
          fi
          # source annotation links the ghcr package to this repo
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"
